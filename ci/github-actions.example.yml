# Example GitHub Actions job for ERP Playwright E2E
# Integrate into enterpriseplatform/.github/workflows/ci.yml or a dedicated workflow.

name: e2e-playwright-example

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ERP backend dependencies
        working-directory: enterpriseplatform
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python manage.py migrate

      - name: Start ERP API
        working-directory: enterpriseplatform
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
          REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          python manage.py runserver 0.0.0.0:8001 &
          sleep 10

      - name: Install UI dependencies and start Vite
        working-directory: ui_enterpriseplatform
        run: |
          npm ci
          npm run dev &
          sleep 15

      - name: Install Playwright framework
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: e2e
        env:
          CI: true
          E2E_ERP_UI_BASE_URL: http://demo.127.0.0.1.nip.io:8002
          E2E_ERP_API_BASE_URL: http://127.0.0.1:8001/api/v1
          E2E_ERP_USERNAME: ${{ secrets.E2E_ERP_USERNAME }}
          E2E_ERP_PASSWORD: ${{ secrets.E2E_ERP_PASSWORD }}
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/reports/
            e2e/test-results/
